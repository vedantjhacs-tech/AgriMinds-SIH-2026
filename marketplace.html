<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Marketplace - AgriMinds</title>
  <meta name="description" content="Explore surplus crop listings directly from farmers across Haryana and Punjab.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    .market-container {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }

    .market-header {
      background: var(--bg-white);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .market-filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .listing-card {
      background: var(--bg-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
    }

    .listing-card:hover {
      transform: translateY(-4px);
    }

    .crop-tag {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    /* Modal styling */
    #addModal, #contactModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-card {
      background: white;
      max-width: 500px;
      width: 100%;
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

  <main>
    <div class="market-container">
      <div class="market-header">
        <div>
          <h2 style="color: var(--primary-dark);">Farmer Direct Marketplace</h2>
          <p style="color: var(--text-muted); font-size: 0.95rem;">Browse or list surplus agricultural produce for direct wholesale buyers.</p>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Crop Listing</button>
      </div>

      <div class="market-filters">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by crop or district..." oninput="filterListings()" style="max-width: 350px;">
      </div>

      <div class="listings-grid" id="listingsGrid">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Add Listing Modal -->
    <div id="addModal">
      <div class="modal-card">
        <h3 style="color: var(--primary-dark); margin-bottom: 1rem;">Add Crop Listing</h3>
        <form id="addListingForm" onsubmit="handleAddNewListing(event)">
          <div class="form-group">
            <label for="listCrop">Crop Name *</label>
            <input type="text" id="listCrop" class="form-control" placeholder="e.g. Basmati Rice / Wheat" required>
          </div>
          <div class="form-group">
            <label for="listQty">Quantity & Unit *</label>
            <input type="text" id="listQty" class="form-control" placeholder="e.g. 150 Quintals" required>
          </div>
          <div class="form-group">
            <label for="listPrice">Expected Price (₹ / Quintal) *</label>
            <input type="number" id="listPrice" class="form-control" placeholder="e.g. 2800" required>
          </div>
          <div class="form-group">
            <label for="listDistrict">District / Location *</label>
            <input type="text" id="listDistrict" class="form-control" placeholder="e.g. Karnal, Haryana" required>
          </div>
          <div class="form-group">
            <label for="listContact">Farmer Name & Mobile *</label>
            <input type="text" id="listContact" class="form-control" placeholder="e.g. Ramesh Kumar - 9876543210" required>
          </div>
          <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="button" class="btn btn-outline" style="flex: 1;" onclick="closeModal('addModal')">Cancel</button>
            <button type="submit" class="btn btn-primary" style="flex: 1;">Publish Listing</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Contact Modal -->
    <div id="contactModal">
      <div class="modal-card">
        <h3 style="color: var(--primary-dark); margin-bottom: 0.5rem;">Farmer Contact Details</h3>
        <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1.5rem;" id="contactDetailsText">-</p>
        <button class="btn btn-primary" style="width: 100%;" onclick="closeModal('contactModal')">Close</button>
      </div>
    </div>
  </main>

  <!-- JS Dependencies -->
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/marketplace.js"></script>
</body>
</html>
